name: Build Permanent Android APK 📱

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Mobile App Dependencies
        working-directory: ./mobile
        run: |
          npm install --legacy-peer-deps

      - name: 🏗️ Generate Native Android Project
        working-directory: ./mobile
        env:
          CI: "1"
        run: |
          npx expo prebuild --platform android --clean --no-install

      - name: 🚀 Build Universal Android APK (Gradle)
        working-directory: ./mobile/android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 🔍 Locate Built APK
        id: find_apk
        run: |
          mkdir -p release-output
          APK_FILE=$(find mobile/android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ Error: No APK file was generated!"
            exit 1
          fi
          echo "✅ Found APK at: $APK_FILE"
          cp "$APK_FILE" release-output/VibeVerse-Universal.apk
          ls -lh release-output/

      - name: 💾 Upload Permanent Artifact (Direct Download)
        uses: actions/upload-artifact@v4
        with:
          name: VibeVerse-Permanent-APK
          path: release-output/VibeVerse-Universal.apk
          retention-days: 90

      - name: 🏷️ Publish GitHub Release with Downloadable APK
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.0.0
          name: VibeVerse Android Release v1.0.0 🌌
          body: |
            ## 🎉 VibeVerse Mobile App APK (Permanent Build)
            Welcome to **VibeVerse** — The fun social app for connecting with like-minded people!
            
            ### ✨ Features Included:
            - 🤝 **Like-Minded Discovery**: Match based on mutual vibe tags (Gaming, Tech, Anime, Music, etc.)
            - 📸 **Photo Sharing**: Share snaps with custom captions and vibe tags
            - ✨ **24h Ephemeral Stories**: Instagram-style stories with auto-expiration
            - 🎬 **Vibe Reels**: Short-form video swiping with music audio tracks
            - 🎨 **Built-in Camera Filter Effects**: Warm, Cool, Vintage, B&W, Vivid, Dreamy, Neon
            - 🎤 **Voice Messages**: Record audio using your microphone during chat
            - 💬 **Real-time Messaging**: Direct text messaging with unread tracking
            
            ### 📥 Direct Installation:
            1. Download `VibeVerse-Universal.apk` below directly onto your Android device.
            2. Tap the file to install (enable "Install from Unknown Sources" if prompted).
            3. Enjoy VibeVerse!
          files: release-output/VibeVerse-Universal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
